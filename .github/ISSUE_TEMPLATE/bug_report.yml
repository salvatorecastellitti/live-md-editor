name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: markdown
    attributes:
      label: Markdown that shows the problem
      description: Paste the smallest markdown that reproduces it.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What did you type, click or paste?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and framework
      placeholder: Safari 26 on iOS, Next.js 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: live-md-editor version
    validations:
      required: true
